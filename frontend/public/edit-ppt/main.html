贴合您的课堂，您希望它呈现什么感觉？现场使用时还有什么需要照顾的？"],"answers":["我是一名小学科学教师，想请你帮我制作一套用于课堂教学的PPT课件。教材是教科版小学科学五年级上册，第三单元《计量时间》第五课《摆的快慢》。这是一节实验新授课，1课时，共40分钟，重点是探究摆长与摆动快慢的关系。学生已经观察过摆的往返运动，能够初步计数，但还不清楚摆长会怎样影响摆动快慢。部分学生在实验中容易同时改变多个条件，也容易把一次测量结果直接当作结论。小组合作时，少数学生操作较多，其他成员参与不足，希望课件能适当提示实验方法，并引导大家分工参与。","我想采用探究式教学模式，按照“问题导入—实验探索—证据解释—迁移拓展—评价反思”来组织这节课。依据修订版布鲁姆教育目标分类，以应用为基础，重点安排分析和评价任务，例如让学生比较不同实验方案、判断是否公平，再运用控制变量的思路完成实验，根据重复测量的记录解释摆长与摆动快慢的关系，实验时让组员分工操作、计时和记录，并轮换任务。希望先让学生预测、尝试和讨论，再逐步呈现提示与结论。课件中也可以穿插一些元认知提示，比如“我们的比较公平吗”“这些记录足以支持结论吗”，帮助学生反思自己的探究过程。","课件整体希望是卡通趣味风格，以暖色系为主，多用有助于理解实验的卡通图片和示意图，文字不要太密。我平时讲课比较幽默，希望加入与知识相关的幽默表达，让课堂轻松一些，同时把注意力放在科学探究上。教室里只有教师电脑和投影，没有学生个人终端。课件中的动画和提示最好通过鼠标点击就能播放或展示，课堂互动以口头回答和小组讨论为主，不要设计需要学生扫码、登录平台或使用个人设备的环节。"]},{"id":"lesson","name":"教案生成","intro":"明确教学目标、重难点与课堂环节安排。","params":[{"key":"professional_background","label":"专业背景"},{"key":"teaching_ability","label":"教学能力"},{"key":"grade","label":"授课年级"},{"key":"teaching_audience","label":"授课对象"},{"key":"textbook_info","label":"教材信息"},{"key":"topic","label":"课程信息"},{"key":"slide_design","label":"课件设计"},{"key":"resource_design","label":"资源设计"},{"key":"model","label":"教学模式"},{"key":"teaching_strategy","label":"教学策略"},{"key":"teaching_method","label":"教学方法"},{"key":"steps","label":"教学环节"},{"key":"teaching_style","label":"教学风格"},{"key":"social_responsibility","label":"社会责任"},{"key":"goal","label":"教学目标"},{"key":"focus","label":"教学重难点"},{"key":"basic_info","label":"基本信息"},{"key":"learning_behavior","label":"学习行为"},{"key":"learning_ability","label":"学习能力"},{"key":"emotional_motivation","label":"情感动机"},{"key":"personality","label":"个性特征"},{"key":"length","label":"时空信息"},{"key":"technology_environment","label":"技术环境"},{"key":"classroom_environment","label":"课堂环境"}],"script":[{"a":"教案主题是《摆的快慢》，依据教科版小学科学五年级上册第三单元《计量时间》第五课，面向小学五年级。","updates":[{"key":"topic","v":"摆的快慢","evidence":"摆的快慢"},{"key":"textbook_info","v":"教科版小学科学五年级上册第三单元《计量时间》第五课","evidence":"教科版小学科学五年级上册第三单元《计量时间》第五课"},{"key":"grade","v":"小学五年级","evidence":"小学五年级"}]},{"a":"教学目标是探 点不当作学生事实。",design_decision_learner:"把已有基础作为导入起点，把待确认的能力差异留给课堂检查，并为参与任务预留轮换空间。",design_reason_goals:"目标依据为「{{goal}}」，重点或实验约束为「{{focus}}」。据此把抽象目标拆成可检查的学习证据：先提出可验证预测，再在控制条件下观察和记录，最后用记录解释结果；评价需要检查证据是否支持结论，而非只复述现象。",design_decision_goals:"页面目标围绕预测、规范取证和证据解释展开，并把重点难点转成明确的检查点。",design_reason_slides:"已确认环节为「{{steps}}」，资源为「{{resources}}」，视觉要求为「{{style}}」，课时为「{{duration}}」，设备条件为「{{technology}}」。据此建议按问题导入、提出预测、探究操作、记录比较、证据解释、迁移拓展与回顾评价逐步展开；交互依赖现有课堂材料和投影，不要求额外学生终端。页数与每页信息量留给后续大纲安排。",design_decision_slides:"形成一条由问题驱动、用实验取证、以解释和迁移收束的页面节奏，再交由大纲细化到逐页内容。"},"zh-TW":{design_basis_label:"已蒐集依據",design_reason_label:"方案推演",design_decision_label:"設計落點",design_reason_missing:"未提供，暫不補充假設",design_reason_context:"已蒐集主題「{{topic}}」、授課對象「{{audience}}」、課時「{{duration}}」及課程／教材資訊「{{course}}」。這些明確條件限定內容範圍、語言難度和活動節奏；尚未蒐集的條件保留為待確認，不自行補寫。",design_decision_context:"據此先鎖定內容邊界與時間預算，後續每項活動都要回到本課目標。",design_reason_graph:"外部科學教育圖譜將探究式教育連結到實驗、拓展應用和總結歸納能力。結合主題「{{topic}}」與教學方式「{{mode}}」，將能力詞轉成可觀察的課堂行為：提出預測、用證據驗證、把發現遷移至熟悉情境並歸納結論。此處展示的是外部能力架構，本課知識圖譜會在後續步驟單獨呈現。",design_decision_graph:"用能力架構確定培養方向，再由本課知識圖譜限制具體知識點與教學目標。",design_reason_learner:"已知基礎為「{{baseline}}」，參與情況為「{{participation}}」，能力線索為「{{learning}}」。因此從既有經驗出發，不重複講解已掌握內容；先用預測和操作看出理解差異，再安排觀察、記錄與交流。未蒐集的易錯點不視為學生事實。",design_decision_learner:"以既有基礎作為導入起點，將待確認的能力差異留給課堂檢查，並為參與任務預留輪替空間。",design_reason_goals:"目標依據為「{{goal}}」，重點或實驗限制為「{{focus}}」。據此把抽象目標拆成可檢查的學習證據：先提出可驗證預測，再在控制條件下觀察與記錄，最後用記錄解釋結果；評量要檢查證據是否支持結論，而非只複述現象。",design_decision_goals:"頁面目標圍繞預測、規範取證與證據解釋展開，並把重點難點轉成明確檢查點。",design_reason_slides:"已確認環節為「{{steps}}」，資源為「{{resources}}」，視覺要求為「{{style}}」，課時為「{{duration}}」，設備條件為「{{technology}}」。據此建議依序安排問題導入、提出預測、探究操作、記錄比較、證據解釋、遷移拓展與回顧評量；互動使用現有課堂材料與投影，不要求額外學生終端。頁數與每頁資訊量留待後續大綱安排。",design_decision_slides:"形成由問題驅動、以實驗取證、用解釋和遷移收束的頁面節奏，再由大綱細化逐頁內容。"},en:{design_basis_label:"Collected evidence",design_reason_label:"Design rationale",design_decision_label:"Design implication",design_reason_missing:"Not provided; no assumption added",design_reason_context:"The collected topic is “{{topic}},” for {{audience}}, within {{duration}}, with course or textbook details “{{course}}.” These confirmed conditions bound the content, language level and activity pace. Missing details remain open instead of being invented.",design_decision_context:"Set the content boundary and time budget first; each later activity must connect back to the lesson objective.",design_reason_graph:"The external science-education graph links inquiry-based education to experimentation, transfer and synthesis. Combined with “{{topic}}” and “{{mode}},” these abilities become observable classroom actions: make a prediction, test it with evidence, transfer the finding to a familiar situation, and summarize the conclusion. This is an external competency framework; the subject knowledge graph for this lesson appears separately in the next step.",design_decision_graph:"Use the competency framework to set the direction, then use the lesson’s knowledge graph to constrain concepts and objectives.",design_reason_learner:"The stated prior knowledge is “{{baseline}}”; participation is “{{participation}}”; the ability evidence is “{{learning}}.” Start from what learners already know, then use a prediction and a short task to reveal differences in understanding before observation, recording and discussion. Unreported misconceptions are not treated as facts.",design_decision_learner:"Use the stated baseline as the entry point, check unknown skill gaps during class, and leave room to rotate participation roles.",design_reason_goals:"The objective is “{{goal}},” with a key focus or experimental constraint of “{{focus}}.” Turn it into checkable evidence: make a testable prediction, observe and record under controlled conditions, then explain the result from the records. Assessment should check whether evidence supports the conclusion, rather than whether learners can repeat an observation.",design_decision_goals:"Build the slide objectives around prediction, sound evidence collection and evidence-based explanation, with explicit checks for the key challenge.",design_reason_slides:"The stated sequence is “{{steps}}”; resources are “{{resources}}”; visual requirements are “{{style}}”; the lesson lasts “{{duration}}”; and the available technology is “{{technology}}.” A suitable progression is a question, prediction, inquiry task, recorded comparison, evidence-based explanation, transfer and review. Use the classroom materials and projector already available, without requiring student devices. The outline will decide the final page count and density.",design_decision_slides:"Shape the deck around a driving question, experimental evidence, and a closing explanation and transfer; refine each page in the outline."},ja:{design_basis_label:"収集済みの根拠",design_reason_label:"設計の考え方",design_decision_label:"設計への反映",design_reason_missing:"未提供のため、仮定を追加しません",design_reason_context:"確認済みのテーマは「{{topic}}」、対象は「{{audience}}」、授業時間は「{{duration}}」、教材情報は「{{course}}」です。これらの条件で内容範囲、言葉の難易度、活動のテンポを定めます。未収集の条件は推測で補いません。",design_decision_context:"まず内容範囲と時間配分を定め、以後の活動を授業目標に結び付けます。",design_reason_graph:"外部の科学教育グラフは、探究型教育を実験、応用・転移、整理・総括の力につなげています。「{{topic}}」と授業方法「{{mode}}」に合わせ、予測を立て、証拠で確かめ、身近な場面に応用し、結論をまとめる行動に置き換えます。これは外部能力フレームであり、この授業の知識グラフは次の段階で別に示します。",design_decision_graph:"能力フレームで育成の方向を定め、授業の知識グラフで概念と目標を絞ります。",design_reason_learner:"既有知識は「{{baseline}}」、参加状況は「{{participation}}」、能力の手掛かりは「{{learning}}」です。すでに知っていることから始め、予測や短い課題で理解の差を確かめてから、観察・記録・話し合いへ進みます。未提供のつまずきは事実として扱いません。",design_decision_learner:"既有知識を導入の起点にし、未確認の技能差は授業中に確認し、役割交代の余地を設けます。",design_reason_goals:"目標は「{{goal}}」、重点または実験条件は「{{focus}}」です。検証可能な予測、条件をそろえた観察と記録、記録に基づく説明という確認可能な学習証拠に分解します。評価では観察の言い直しではなく、証拠が結論を支えるかを確かめます。",design_decision_goals:"予測、適切な証拠収集、根拠に基づく説明をスライド目標にし、重点を確認項目にします。",design_reason_slides:"確認済みの流れは「{{steps}}」、教材は「{{resources}}」、視覚要件は「{{style}}」、授業時間は「{{duration}}」、設備条件は「{{technology}}」です。問い、予測、探究、記録比較、証拠の説明、応用、振り返りの順が適しています。既存の教材と投影を使い、生徒用端末は求めません。最終的なページ数と情報量は後の大綱で調整します。",design_decision_slides:"問いから始め、実験証拠を集め、説明と応用で締める流れを作り、各ページは大綱で具体化します。"},ko:{design_basis_label:"수집된 근거",design_reason_label:"설계 추론",design_decision_label:"설계 반영",design_reason_missing:"제공되지 않아 가정을 추가하지 않습니다",design_reason_context:"확인된 주제는 “{{topic}}”, 대상은 “{{audience}}”, 수업 시간은 “{{duration}}”, 교재 정보는 “{{course}}”입니다. 이 조건을 콘텐츠 범위와 표현 난이도, 활동 속도의 기준으로 삼습니다. 확인되지 않은 내용은 임의로 채우지 않습니다.",design_decision_context:"먼저 콘텐츠 범위와 시간 배분을 정하고, 이후 활동을 수업 목표에 연결합니다.",design_reason_graph:"외부 과학교육 그래프는 탐구 교육을 실험, 전이·응용, 종합·정리 역량과 연결합니다. “{{topic}}”와 수업 방식 “{{mode}}”를 바탕으로 예측하기, 근거로 검증하기, 익숙한 상황에 적용하기, 결론 정리하기 같은 관찰 가능한 행동으로 바꿉니다. 이 단계는 외부 역량 틀이며, 이 수업의 지식 그래프는 다음 단계에서 따로 제시합니다.",design_decision_graph:"역량 틀로 교육 방향을 정하고, 수업 지식 그래프로 개념과 목표를 구체화합니다.",design_reason_learner:"확인된 선행 지식은 “{{baseline}}”, 참여 상황은 “{{participation}}”, 역량 단서는 “{{learning}}”입니다. 이미 아는 내용에서 시작하고 예측이나 짧은 과제로 이해 차이를 확인한 뒤 관찰·기록·토론으로 이어갑니다. 제공되지 않은 오개념은 사실로 간주하지 않습니다.",design_decision_learner:"확인된 기초를 도입점으로 삼고 미확인 역량 차이는 수업 중 점검하며 역할 순환을 고려합니다.",design_reason_goals:"목표는 “{{goal}}”, 핵심 초점 또는 실험 조건은 “{{focus}}”입니다. 검증 가능한 예측, 조건을 통제한 관찰과 기록, 기록에 근거한 설명이라는 확인 가능한 증거로 나눕니다. 평가는 현상 재진술보다 증거가 결론을 뒷받침하는지 확인합니다.",design_decision_goals:"예측, 근거 수집, 근거에 기반한 설명을 슬라이드 목표와 확인 항목으로 둡니다.",design_reason_slides:"확인된 수업 단계는 “{{steps}}”, 자료는 “{{resources}}”, 시각 요구는 “{{style}}”, 수업 시간은 “{{duration}}”, 장비 조건은 “{{technology}}”입니다. 질문, 예측, 탐구, 기록 비교, 근거 설명, 적용, 정리 순서를 제안합니다. 교실 자료와 프로젝터를 활용하고 학생 단말기는 요구하지 않습니다. 페이지 수와 정보량은 다음 개요에서 정합니다.",design_decision_slides:"질문으로 시작해 실험 근거를 모으고 설명과 적용으로 마무리하는 흐름을 만들며, 개요 단계에서 페이지별 내용을 정리합니다."},es:{design_basis_label:"Datos recopilados",design_reason_label:"Razonamiento de diseño",design_decision_label:"Decisión de diseño",design_reason_missing:"No indicado; no se añaden suposiciones",design_reason_context:"El tema confirmado es «{{topic}}», para {{audience}}, en {{duration}}, con estos datos de curso o libro: «{{course}}». Estas condiciones delimitan el contenido, el nivel del lenguaje y el ritmo. Lo que falta se deja pendiente, sin inventarlo.",design_decision_context:"Primero se fijan el alcance y el tiempo; cada actividad posterior debe responder al objetivo de la clase.",design_reason_graph:"El grafo externo de educación científica relaciona la indagación con experimentación, transferencia y síntesis. Junto con «{{topic}}» y «{{mode}}», esas capacidades se traducen en acciones observables: predecir, comprobar con pruebas, aplicar el hallazgo a una situación conocida y resumir la conclusión. Este es un marco externo de capacidades; el grafo de conocimientos de esta clase se mostrará aparte en el paso siguiente.",design_decision_graph:"El marco define las capacidades; el grafo de conocimientos de la clase delimita los conceptos y objetivos concretos.",design_reason_learner:"Los conocimientos previos indicados son «{{baseline}}»; la participación, «{{participation}}»; y las capacidades descritas, «{{learning}}». Partimos de lo que ya conocen y usamos una predicción y una tarea breve para detectar diferencias antes de observar, registrar y debatir. Los errores no indicados no se presentan como hechos.",design_decision_learner:"Usar la base indicada como punto de entrada, comprobar las brechas desconocidas durante la clase y prever la rotación de roles.",design_reason_goals:"El objetivo indicado es «{{goal}}» y el foco o condición experimental es «{{focus}}». Se convierten en evidencias observables: formular una predicción comprobable, observar y registrar con condiciones controladas, y explicar el resultado con esos registros. La evaluación debe comprobar el vínculo entre pruebas y conclusión, no solo repetir lo observado.",design_decision_goals:"Organizar los objetivos de las diapositivas en torno a la predicción, la recogida rigurosa de pruebas y su explicación.",design_reason_slides:"La secuencia indicada es «{{steps}}»; los recursos, «{{resources}}»; el estilo, «{{style}}»; la duración, «{{duration}}»; y la tecnología disponible, «{{technology}}». Se propone avanzar desde una pregunta y una predicción hacia la indagación, el registro comparado, la explicación, la transferencia y la revisión. Se usan materiales y proyección del aula, sin exigir dispositivos al alumnado. El esquema decidirá el número y la densidad de las diapositivas.",design_decision_slides:"Construir una secuencia guiada por una pregunta, sustentada en pruebas experimentales y cerrada con explicación y transferencia."},pt:{design_basis_label:"Dados recolhidos",design_reason_label:"Raciocínio de conceção",design_decision_label:"Decisão de conceção",design_reason_missing:"Não indicado; nenhuma suposição será acrescentada",design_reason_context:"O tema confirmado é «{{topic}}», para {{audience}}, em {{duration}}, com os dados curriculares ou do manual «{{course}}». Estas condições delimitam o conteúdo, a linguagem e o ritmo das atividades. O que não foi recolhido fica por confirmar, sem ser inventado.",design_decision_context:"Definir primeiro o âmbito e o tempo; cada atividade seguinte deve responder ao objetivo da aula.",design_reason_graph:"O grafo externo de educação científica relaciona a aprendizagem por investigação com experimentação, transferência e síntese. Em conjunto com «{{topic}}» e «{{mode}}», estas capacidades tornam-se ações observáveis: prever, verificar com evidências, aplicar a descoberta a uma situação familiar e resumir a conclusão. Este é um referencial externo de competências; o grafo de conhecimentos desta aula surge separadamente no passo seguinte.",design_decision_graph:"Usar o referencial para definir competências e o grafo da aula para delimitar conceitos e objetivos concretos.",design_reason_learner:"Os conhecimentos prévios indicados são «{{baseline}}»; a participação, «{{participation}}»; e as capacidades descritas, «{{learning}}». Partir do que já sabem e usar uma previsão e uma tarefa breve para identificar diferenças antes de observar, registar e discutir. Dificuldades não indicadas não são tratadas como factos.",design_decision_learner:"Usar a base confirmada como ponto de partida, verificar lacunas durante a aula e prever a rotação de funções.",design_reason_goals:"O objetivo indicado é «{{goal}}» e o foco ou condição experimental é «{{focus}}». Traduzir isso em evidências observáveis: formular uma previsão testável, observar e registar sob condições controladas e explicar o resultado a partir dos registos. A avaliação verifica se as evidências sustentam a conclusão, em vez de apenas repetir o fenómeno.",design_decision_goals:"Organizar os objetivos das diapositivas em torno da previsão, recolha rigorosa de evidências e explicação fundamentada.",design_reason_slides:"A sequência confirmada é «{{steps}}»; os recursos são «{{resources}}»; o estilo, «{{style}}»; a duração, «{{duration}}»; e a tecnologia disponível, «{{technology}}». Propõe-se avançar da pergunta e previsão para a investigação, comparação dos registos, explicação, transferência e revisão. Usar os materiais existentes e a projeção, sem exigir dispositivos aos alunos. O esboço define o número e a densidade dos diapositivos.",design_decision_slides:"Criar uma sequência orientada por uma pergunta, apoiada em evidências experimentais e concluída com explicação e transferência."},de:{design_basis_label:"Erfasste Angaben",design_reason_label:"Planungsbegründung",design_decision_label:"Folgerung für den Entwurf",design_reason_missing:"Nicht angegeben; keine Annahme ergänzt",design_reason_context:"Bestätigt sind das Thema „{{topic}}“, die Zielgruppe „{{audience}}“, die Dauer „{{duration}}“ und Lehrplan- oder Lehrwerksangaben „{{course}}“. Diese Angaben begrenzen Inhalte, Sprachniveau und Aktivitätstempo. Fehlende Angaben bleiben offen.",design_decision_context:"Zuerst Umfang und Zeitrahmen festlegen; jede folgende Aktivität muss zum Lernziel passen.",design_reason_graph:"Der externe naturwissenschaftliche Bildungsgraph verknüpft forschendes Lernen mit Experimentieren, Transfer und Zusammenfassen. Aus „{{topic}}“ und „{{mode}}“ werden beobachtbare Handlungen: Vermutungen äußern, mit Belegen prüfen, Erkenntnisse auf eine vertraute Situation übertragen und Schlussfolgerungen ziehen. Dies ist ein externes Kompetenzmodell; der fachliche Wissensgraph dieser Stunde folgt separat im nächsten Schritt.",design_decision_graph:"Das Kompetenzmodell gibt die Richtung vor; der Wissensgraph der Stunde begrenzt die konkreten Begriffe und Ziele.",design_reason_learner:"Als Vorwissen wurde „{{baseline}}“ genannt, zur Beteiligung „{{participation}}“ und zu Fähigkeiten „{{learning}}“. An Bekanntes anknüpfen und mit einer Vermutung sowie einer kurzen Aufgabe Verständnisunterschiede erkennen, bevor beobachtet, dokumentiert und diskutiert wird. Nicht genannte Fehlvorstellungen gelten nicht als Tatsachen.",design_decision_learner:"Den bestätigten Lernstand als Einstieg nutzen, offene Kompetenzfragen im Unterricht prüfen und wechselnde Rollen einplanen.",design_reason_goals:"Das Ziel lautet „{{goal}}“; Schwerpunkt oder Versuchsbedingung ist „{{focus}}“. Daraus werden überprüfbare Lernbelege: eine prüfbare Vermutung, Beobachtung und Aufzeichnung unter kontrollierten Bedingungen sowie eine Erklärung anhand der Aufzeichnungen. Die Bewertung prüft, ob Belege die Schlussfolgerung tragen.",design_decision_goals:"Folienziele auf Vermutung, sorgfältige Belegsammlung und begründete Erklärung ausrichten.",design_reason_slides:"Die bestätigte Abfolge lautet „{{steps}}“, die Materialien „{{resources}}“, die Gestaltungswünsche „{{style}}“, die Dauer „{{duration}}“ und die Technik „{{technology}}“. Sinnvoll ist die Folge Frage, Vermutung, Untersuchung, Datenvergleich, Erklärung, Transfer und Rückblick. Vorhandene Materialien und Projektion reichen aus; Schülergeräte sind nicht nötig. Die Gliederung legt Seitenzahl und Informationsdichte fest.",design_decision_slides:"Eine von einer Frage geleitete Abfolge mit experimentellen Belegen sowie abschließender Erklärung und Transfer planen."},fr:{design_basis_label:"Éléments recueillis",design_reason_label:"Raisonnement de conception",design_decision_label:"Conséquence pour le cours",design_reason_missing:"Non indiqué ; aucune hypothèse ajoutée",design_reason_context:"Le thème confirmé est « {{topic}} », pour {{audience}}, sur {{duration}}, avec les informations de cours ou de manuel « {{course}} ». Ces conditions délimitent le contenu, le niveau de langue et le rythme. Les éléments manquants restent à confirmer.",design_decision_context:"Définir d’abord le périmètre et le temps ; chaque activité devra servir l’objectif du cours.",design_reason_graph:"Le graphe externe d’éducation scientifique relie l’investigation à l’expérimentation, au transfert et à la synthèse. Avec « {{topic}} » et « {{mode}} », ces capacités deviennent des actions observables : formuler une prévision, la vérifier par des preuves, transférer une découverte à une situation familière et résumer la conclusion. Il s’agit d’un cadre externe de compétences ; le graphe des connaissances de cette leçon apparaît séparément à l’étape suivante.",design_decision_graph:"Le cadre fixe les compétences à développer ; le graphe de la leçon précise les notions et objectifs.",design_reason_learner:"Les acquis indiqués sont « {{baseline}} », la participation « {{participation}} » et les capacités « {{learning}} ». Partir de ces acquis, puis utiliser une prévision et une courte tâche pour repérer les écarts avant l’observation, la prise de notes et l’échange. Les difficultés non signalées ne sont pas présentées comme des faits.",design_decision_learner:"S’appuyer sur les acquis confirmés, vérifier les écarts pendant la séance et prévoir une rotation des rôles.",design_reason_goals:"L’objectif indiqué est « {{goal}} » et le point clé ou la contrainte expérimentale est « {{focus}} ». En tirer des preuves observables : prédire, observer et consigner sous conditions contrôlées, puis expliquer le résultat à partir des notes. L’évaluation vérifie si les preuves justifient la conclusion.",design_decision_goals:"Structurer les objectifs autour de la prévision, du recueil rigoureux des preuves et de leur interprétation.",design_reason_slides:"La séquence confirmée est « {{steps}} », les ressources « {{resources}} », les exigences visuelles « {{style}} », la durée « {{duration}} » et le matériel « {{technology}} ». Prévoir une question, une prévision, une investigation, la comparaison des notes, une explication, un transfert et un bilan. Utiliser le matériel disponible et la projection sans imposer d’appareil aux élèves. Le plan détaillera ensuite les pages.",design_decision_slides:"Construire une progression guidée par une question, étayée par des preuves expérimentales et conclue par une explication et un transfert."},th:{design_basis_label:"ข้อมูลที่รวบรวมได้",design_reason_label:"เหตุผลการออกแบบ",design_decision_label:"ผลต่อการออกแบบ",design_reason_missing:"ไม่ได้ระบุ จึงไม่ตั้งสมมติฐานเพิ่ม",design_reason_context:"หัวข้อที่ยืนยันคือ “{{topic}}” สำหรับ “{{audience}}” ใช้เวลา “{{duration}}” และมีข้อมูลรายวิชาหรือหนังสือ “{{course}}” เงื่อนไขเหล่านี้กำหนดขอบเขตเนื้อหา ระดับภาษา และจังหวะกิจกรรม ส่วนข้อมูลที่ยังไม่มีจะระบุว่ารอยืนยัน",design_decision_context:"กำหนดขอบเขตและเวลาให้ชัดก่อน แล้วเชื่อมทุกกิจกรรมกับเป้าหมายบทเรียน",design_reason_graph:"กราฟการศึกษาวิทยาศาสตร์ภายนอกเชื่อมการเรียนรู้แบบสืบค้นกับการทดลอง การประยุกต์ต่อยอด และการสรุป เมื่อพิจารณา “{{topic}}” และ “{{mode}}” จะแปลงความสามารถเหล่านี้เป็นพฤติกรรมที่สังเกตได้ ได้แก่ ตั้งสมมติฐาน ตรวจสอบด้วยหลักฐาน นำสิ่งที่พบไปใช้กับสถานการณ์คุ้นเคย และสรุปข้อค้นพบ นี่คือกรอบความสามารถภายนอก ส่วนกราฟความรู้ของบทเรียนจะแสดงแยกในขั้นถัดไป",design_decision_graph:"ใช้กรอบความสามารถกำหนดทิศทาง และใช้กราฟความรู้ของบทเรียนกำหนดแนวคิดกับเป้าหมายเฉพาะ",design_reason_learner:"พื้นฐานที่ระบุคือ “{{baseline}}” การมีส่วนร่วมคือ “{{participation}}” และข้อมูลความสามารถคือ “{{learning}}” เริ่มจากสิ่งที่ผู้เรียนรู้แล้ว ใช้การคาดการณ์และภารกิจสั้นเพื่อตรวจความเข้าใจ ก่อนสังเกต บันทึก และอภิปราย จุดที่ยังไม่ได้ระบุจะไม่ถือเป็นข้อเท็จจริง",design_decision_learner:"ใช้พื้นฐานที่ยืนยันเป็นจุดเริ่ม ตรวจช่องว่างระหว่างเรียน และเผื่อการหมุนเวียนหน้าที่",design_reason_goals:"เป้าหมายคือ “{{goal}}” และประเด็นสำคัญหรือเงื่อนไขทดลองคือ “{{focus}}” จึงแยกเป็นหลักฐานการเรียนรู้ที่ตรวจได้ ได้แก่ คาดการณ์ที่ทดสอบได้ สังเกตและบันทึกภายใต้เงื่อนไขควบคุม แล้วอธิบายผลจากบันทึก การประเมินตรวจว่าหลักฐานรองรับข้อสรุปหรือไม่",design_decision_goals:"กำหนดเป้าหมายสไลด์รอบการคาดการณ์ การเก็บหลักฐานอย่างเป็นระบบ และการอธิบายจากหลักฐาน",design_reason_slides:"ขั้นตอนที่ยืนยันคือ “{{steps}}” ทรัพยากร “{{resources}}” รูปแบบ “{{style}}” เวลา “{{duration}}” และอุปกรณ์ “{{technology}}” แนะนำลำดับตั้งคำถาม คาดการณ์ สำรวจ เปรียบเทียบบันทึก อธิบาย ประยุกต์ และทบทวน ใช้วัสดุในห้องเรียนกับโปรเจกเตอร์ โดยไม่ต้องให้นักเรียนใช้อุปกรณ์ส่วนตัว จำนวนหน้าและรายละเอียดจะกำหนดในโครงร่างภายหลัง",design_decision_slides:"วางลำดับจากคำถามไปสู่หลักฐานการทดลอง แล้วปิดท้ายด้วยการอธิบายและการประยุกต์"},id:{design_basis_label:"Informasi yang terkumpul",design_reason_label:"Alasan perancangan",design_decision_label:"Implikasi desain",design_reason_missing:"Tidak tersedia; tidak menambahkan asumsi",design_reason_context:"Topik yang dikonfirmasi adalah “{{topic}}”, untuk {{audience}}, selama {{duration}}, dengan informasi pelajaran atau buku “{{course}}”. Kondisi ini membatasi cakupan materi, tingkat bahasa, dan tempo aktivitas. Informasi yang belum tersedia tetap menunggu konfirmasi.",design_decision_context:"Tetapkan cakupan dan waktu terlebih dahulu; setiap kegiatan berikutnya harus mengarah pada tujuan pelajaran.",design_reason_graph:"Graf pendidikan sains eksternal menghubungkan pembelajaran inkuiri dengan eksperimen, penerapan, dan sintesis. Berdasarkan “{{topic}}” dan “{{mode}}”, kemampuan itu diubah menjadi tindakan yang dapat diamati: membuat prediksi, menguji dengan bukti, menerapkan temuan pada situasi yang dikenal, lalu merangkum kesimpulan. Ini adalah kerangka kemampuan eksternal; graf pengetahuan untuk pelajaran ini ditampilkan terpisah pada tahap berikutnya.",design_decision_graph:"Gunakan kerangka kemampuan untuk menentukan arah, lalu graf pengetahuan pelajaran untuk membatasi konsep dan tujuan.",design_reason_learner:"Pengetahuan awal yang disebutkan adalah “{{baseline}}”, partisipasi “{{participation}}”, dan petunjuk kemampuan “{{learning}}”. Mulai dari hal yang sudah diketahui; gunakan prediksi dan tugas singkat untuk menemukan perbedaan pemahaman sebelum observasi, pencatatan, dan diskusi. Kesulitan yang tidak disebutkan tidak dianggap sebagai fakta.",design_decision_learner:"Jadikan kemampuan awal yang terkonfirmasi sebagai titik masuk, periksa kesenjangan saat pelajaran, dan sisakan ruang untuk rotasi peran.",design_reason_goals:"Tujuan yang disebutkan adalah “{{goal}}”; fokus atau kondisi eksperimen “{{focus}}”. Uraikan menjadi bukti belajar yang dapat diperiksa: membuat prediksi yang dapat diuji, mengamati dan mencatat dengan kondisi terkendali, lalu menjelaskan hasil berdasarkan catatan. Penilaian memeriksa apakah bukti mendukung kesimpulan.",design_decision_goals:"Susun sasaran slide seputar prediksi, pengumpulan bukti yang cermat, dan penjelasan berbasis bukti.",design_reason_slides:"Urutan yang dikonfirmasi adalah “{{steps}}”, sumber “{{resources}}”, kebutuhan visual “{{style}}”, durasi “{{duration}}”, dan perangkat “{{technology}}”. Rekomendasinya: pertanyaan, prediksi, penyelidikan, perbandingan catatan, penjelasan bukti, penerapan, dan refleksi. Gunakan bahan kelas dan proyektor tanpa mewajibkan perangkat siswa. Jumlah dan kepadatan slide ditentukan pada tahap kerangka.",design_decision_slides:"Bangun alur dari pertanyaan, kumpulkan bukti melalui eksperimen, lalu tutup dengan penjelasan dan penerapan."},ru:{design_basis_label:"Собранные данные",design_reason_label:"Обоснование решения",design_decision_label:"Решение для урока",design_reason_missing:"Не указано; предположения не добавляются",design_reason_context:"Подтверждены тема «{{topic}}», аудитория «{{audience}}», длительность «{{duration}}» и сведения о курсе или учебнике «{{course}}». Эти условия задают границы содержания, уровень языка и темп занятий. Недостающие данные остаются на уточнение.",design_decision_context:"Сначала определить границы содержания и время; каждое последующее задание связать с целью урока.",design_reason_graph:"Внешний граф научного образования связывает исследовательское обучение с экспериментом, переносом и обобщением. С учётом темы «{{topic}}» и формата «{{mode}}» эти способности становятся наблюдаемыми действиями: выдвинуть прогноз, проверить его по данным, применить вывод к знакомой ситуации и обобщить результат. Это внешняя модель компетенций; граф знаний по теме урока будет показан отдельно на следующем этапе.",design_decision_graph:"Модель компетенций задаёт направление, а граф знаний урока ограничивает конкретные понятия и цели.",design_reason_learner:"Указанная база знаний: «{{baseline}}»; участие: «{{participation}}»; данные о навыках: «{{learning}}». Начать с уже знакомого и с помощью прогноза и короткого задания выявить разницу в понимании, затем перейти к наблюдению, записи и обсуждению. Неуказанные трудности не выдаются за факты.",design_decision_learner:"Взять подтверждённую базу за точку входа, проверить неизвестные пробелы во время урока и предусмотреть смену ролей.",design_reason_goals:"Цель сформулирована как «{{goal}}», а ключевой акцент или условие опыта — «{{focus}}». Разложить её на проверяемые результаты: сделать проверяемый прогноз, наблюдать и записывать при контролируемых условиях, затем объяснить результат по записям. Оценивание должно проверить, подтверждают ли данные вывод.",design_decision_goals:"Выстроить цели слайдов вокруг прогноза, аккуратного сбора данных и объяснения на основе доказательств.",design_reason_slides:"Подтверждённая последовательность: «{{steps}}»; материалы: «{{resources}}»; визуальные требования: «{{style}}»; время: «{{duration}}»; оборудование: «{{technology}}». Предлагается пройти вопрос, прогноз, исследование, сравнение записей, объяснение, перенос     <span class="ppt-edit-nav__step"><b>3</b><span>教学思维链</span></span>

</nav><div id="root"></div><script src="ppt-generator.js"></script>
<script>
(function(){
  const syncTeachingNav=()=>{
    const steps=[...document.querySelectorAll('.ppt-edit-nav__step')];
    const stageButtons=[...document.querySelectorAll('.ppt-teaching-stages button')];
    const active=stageButtons.findIndex((button)=>button.classList.contains('is-active'));
    if(active<0)return;
    steps.forEach((step,index)=>{
      step.classList.toggle('is-active',index===active);
      step.classList.toggle('is-done',index<active);
    });
  };
  const root=document.getElementById('root');
  if(root){
    new MutationObserver(syncTeachingNav).observe(root,{subtree:true,childList:true,attributes:true,attributeFilter:['class','aria-current']});
    syncTeachingNav();
  }
})();
</script>
