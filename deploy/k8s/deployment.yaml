apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppt-edit
  labels:
    app.kubernetes.io/name: ppt-edit
spec:
  # SQLite is used by the current application. Keep one replica until the
  # database is moved to PostgreSQL and background work has a shared queue.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ppt-edit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ppt-edit
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ppt-edit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: ppt-edit-config
            - secretRef:
                name: ppt-edit-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: database
              mountPath: /app/backend/instance
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: ppt-edit-database
        - name: uploads
          persistentVolumeClaim:
            claimName: ppt-edit-uploads
