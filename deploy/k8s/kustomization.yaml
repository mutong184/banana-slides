apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ppt-edit

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# Replace this image with the registry where the Linux image is published.
images:
  - name: ppt-edit
    newName: ghcr.io/your-org/ppt-edit
    newTag: latest
